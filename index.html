<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Round Robin" />
<meta name="theme-color" content="#1F6B44" />
<title>Round Robin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper:#F2EEE2; --card:#FBF9F1; --ink:#16170E; --sub:#6E6B59;
    --line:#DED7C3; --green:#1F6B44; --optic:#D8E000; --loss:#B8B2A0;
    --display:'Bricolage Grotesque','Archivo',sans-serif;
    --body:'Archivo',system-ui,sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html,body { background:var(--paper); }
  body {
    color:var(--ink); font-family:var(--body); min-height:100vh;
    background-image:repeating-linear-gradient(0deg, transparent, transparent 38px, rgba(31,107,68,0.04) 38px, rgba(31,107,68,0.04) 39px);
    padding-bottom:40px;
  }
  button { font-family:inherit; cursor:pointer; }
  input:focus { outline:2px solid var(--green); outline-offset:1px; }
  @keyframes pop { 0%{transform:scale(.85)} 60%{transform:scale(1.06)} 100%{transform:scale(1)} }
  @keyframes fade { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }

  header {
    position:sticky; top:0; z-index:10; background:var(--green); color:#fff;
    padding:calc(18px + env(safe-area-inset-top)) 18px 14px; border-bottom:3px solid var(--optic);
  }
  .head-row { display:flex; align-items:baseline; justify-content:space-between; }
  h1 { font-family:var(--display); font-weight:800; font-size:26px; letter-spacing:-0.02em; line-height:1; }
  .progress { font-size:13px; font-weight:600; opacity:.9; }
  .subtitle { font-size:12.5px; opacity:.85; margin-top:4px; }
  .tabs { display:flex; gap:6px; margin-top:14px; background:rgba(255,255,255,.14); padding:4px; border-radius:12px; }
  .tab { flex:1; border:none; border-radius:9px; padding:9px 0; font-weight:700; font-size:14.5px;
         background:transparent; color:#fff; transition:all .18s ease; }
  .tab.active { background:var(--optic); color:var(--ink); }

  main { max-width:560px; margin:0 auto; padding:16px 14px; }
  .pane { animation:fade .25s ease; }

  .editor { background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:16px; padding:12px 14px; }
  .editor.open { padding:14px; }
  .editor-toggle { display:flex; align-items:center; justify-content:space-between; width:100%; background:none; border:none; font-weight:700; font-size:14px; color:var(--ink); }
  .editor-toggle .lbl { display:flex; align-items:center; gap:7px; }
  .editor-toggle .state { font-size:12.5px; color:var(--sub); font-weight:600; }

  .setup-row { display:flex; align-items:center; justify-content:space-between; margin-top:13px; }
  .setup-row .rlabel { font-weight:600; font-size:14.5px; }
  .stepper { display:flex; align-items:center; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--paper); }
  .stepper button { width:42px; height:40px; border:none; background:transparent; font-size:22px; font-weight:700; color:var(--green); line-height:1; }
  .stepper button:disabled { color:#cfc8b6; }
  .stepper .val { width:48px; text-align:center; font-weight:800; font-family:var(--display); font-size:17px; }

  .divider { height:1px; background:var(--line); margin:15px 0 4px; }
  .sub-label { font-size:11.5px; font-weight:700; color:var(--sub); text-transform:uppercase; letter-spacing:.05em; margin:12px 0 2px; }
  .name-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .name-grid input { border:1px solid var(--line); border-radius:9px; padding:9px 10px; font-size:14px;
                     background:var(--paper); color:var(--ink); font-weight:600; width:100%; }

  section.round { margin-bottom:22px; }
  .round-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; gap:10px; }
  .round-head h2 { font-family:var(--display); font-weight:800; font-size:17px; letter-spacing:-0.01em; white-space:nowrap; }
  .bye { font-size:12px; color:var(--sub); font-weight:600; text-align:right; }

  .match { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px; }
  .court { font-size:11.5px; font-weight:700; color:var(--green); text-transform:uppercase; letter-spacing:.05em; margin-bottom:9px; }
  .vs-grid { display:grid; grid-template-columns:1fr auto 1fr; align-items:stretch; gap:8px; }
  .vs { display:flex; align-items:center; justify-content:center; width:18px; font-weight:800; font-size:12px; color:var(--sub); font-family:var(--display); }
  .team-btn { border:1.5px solid var(--line); background:#fff; color:var(--ink); border-radius:11px; padding:12px 8px;
              font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; gap:6px;
              text-align:center; transition:all .16s ease; min-height:48px; line-height:1.15; }
  .team-btn span { overflow:hidden; text-overflow:ellipsis; }
  .team-btn.winner { border:2px solid var(--green); background:var(--green); color:#fff; animation:pop .22s ease; }
  .team-btn.loser { color:var(--loss); }
  .score-row { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; margin-top:8px; }
  .score-row .dash { width:18px; text-align:center; color:var(--sub); font-weight:700; }
  .score-row input { width:100%; border:1px solid var(--line); border-radius:9px; padding:7px 8px; font-size:16px;
                     background:var(--paper); color:var(--ink); font-weight:700; text-align:center; font-family:var(--body); }
  .score-row input::placeholder { color:#bdb6a2; font-weight:600; font-size:13px; }

  .reset { display:flex; align-items:center; gap:8px; margin:6px auto 0; background:none; border:1px solid var(--line);
           color:var(--sub); border-radius:10px; padding:9px 16px; font-weight:600; font-size:13.5px; }

  .table { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .trow { display:grid; grid-template-columns:34px 1fr 44px 44px 52px; align-items:center; padding:13px 14px; border-bottom:1px solid var(--line); }
  .trow:last-child { border-bottom:none; }
  .thead { padding:11px 14px; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--sub); }
  .trow.top { background:rgba(216,224,0,.16); }
  .rank { font-family:var(--display); font-weight:800; font-size:16px; color:var(--sub); }
  .trow.top .rank { color:var(--green); }
  .tname { font-weight:700; font-size:15px; display:flex; align-items:center; gap:6px; }
  .twin { text-align:center; font-weight:800; font-size:17px; font-family:var(--display); }
  .tloss { text-align:center; font-weight:600; font-size:15px; color:var(--loss); }
  .tdiff { text-align:center; font-weight:600; font-size:14px; color:var(--sub); }
  .note { font-size:12.5px; color:var(--sub); margin-top:12px; text-align:center; }
  svg { display:block; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  "use strict";

  var DEFAULT_TEAM_COUNT = 7;
  var DEFAULT_COURTS = 3;
  var MIN_TEAMS = 2, MAX_TEAMS = 16;
  var MIN_COURTS = 1, MAX_COURTS = 8;
  var KEY = "pickleball-rr";

  // ---- State ----
  var teams = [];                 // team names, length = team count
  for (var i = 0; i < DEFAULT_TEAM_COUNT; i++) teams.push("Team " + (i + 1));
  var courts = DEFAULT_COURTS;
  var results = {};               // keyed "min-max" (team indices) -> winning team index
  var scores = {};                // optional, keyed "min-max" -> { teamIndex: points }
  var schedule = [];              // [{round, court, a, b}]
  var tab = "schedule";
  var setupOpen = false;

  // ---- Round-robin scheduler (circle method) ----
  function generateRounds(n) {
    var t = [];
    for (var k = 0; k < n; k++) t.push(k);
    if (n % 2 === 1) t.push(-1);  // phantom team => its opponent rests
    var m = t.length, half = m / 2, numRounds = m - 1;
    var arr = t.slice(), rounds = [];
    for (var r = 0; r < numRounds; r++) {
      var pairs = [];
      for (var j = 0; j < half; j++) {
        var x = arr[j], y = arr[m - 1 - j];
        if (x !== -1 && y !== -1) pairs.push([x, y]);
      }
      rounds.push(pairs);
      arr = [arr[0]].concat([arr[m - 1]]).concat(arr.slice(1, m - 1)); // rotate, keep arr[0] fixed
    }
    return rounds;
  }

  // Pack the round-robin games onto the available courts. Each round fills
  // every court it can, pulling forward the earliest remaining game whose
  // teams are both free, so no court sits empty while games are left.
  function buildSchedule(n, c) {
    var queue = [].concat.apply([], generateRounds(n)), sched = [], displayRound = 0;
    while (queue.length) {
      displayRound++;
      var busy = {}, court = 0, later = [];
      queue.forEach(function (p) {
        if (court < c && !busy[p[0]] && !busy[p[1]]) {
          busy[p[0]] = busy[p[1]] = 1;
          sched.push({ round: displayRound, court: ++court, a: p[0], b: p[1] });
        } else {
          later.push(p);
        }
      });
      queue = later;
    }
    return sched;
  }

  function pairKey(a, b) { return Math.min(a, b) + "-" + Math.max(a, b); }

  function rebuild() {
    schedule = buildSchedule(teams.length, courts);
    // prune any stored results that are no longer valid matchups
    var valid = {};
    schedule.forEach(function (g) { valid[pairKey(g.a, g.b)] = 1; });
    Object.keys(results).forEach(function (key) { if (!valid[key]) delete results[key]; });
    Object.keys(scores).forEach(function (key) { if (!valid[key]) delete scores[key]; });
  }

  // Both teams' points for a game, or null if the score isn't fully entered.
  function scoreOf(a, b) {
    var s = scores[pairKey(a, b)];
    if (!s || typeof s[a] !== "number" || typeof s[b] !== "number") return null;
    var out = {}; out[a] = s[a]; out[b] = s[b];
    return out;
  }

  // ---- App icon + manifest (for "Add to Home Screen") ----
  var ICON_SVG = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'>" +
    "<rect width='180' height='180' rx='40' fill='#1F6B44'/>" +
    "<circle cx='90' cy='82' r='46' fill='#D8E000'/>" +
    "<g fill='#1F6B44'><circle cx='90' cy='60' r='5'/><circle cx='72' cy='74' r='5'/><circle cx='108' cy='74' r='5'/>" +
    "<circle cx='78' cy='95' r='5'/><circle cx='102' cy='95' r='5'/><circle cx='90' cy='105' r='5'/></g>" +
    "<text x='90' y='160' font-family='Arial,sans-serif' font-size='30' font-weight='800' fill='#F2EEE2' text-anchor='middle'>RR</text></svg>";
  var iconHref = "data:image/svg+xml," + encodeURIComponent(ICON_SVG);
  var appleIcon = document.createElement("link");
  appleIcon.rel = "apple-touch-icon"; appleIcon.href = iconHref; document.head.appendChild(appleIcon);
  var favicon = document.createElement("link");
  favicon.rel = "icon"; favicon.href = iconHref; document.head.appendChild(favicon);
  try {
    var manifest = { name:"Round Robin", short_name:"Round Robin", display:"standalone",
      background_color:"#F2EEE2", theme_color:"#1F6B44", start_url:".",
      icons:[{ src:iconHref, sizes:"180x180", type:"image/svg+xml" }] };
    var mlink = document.createElement("link");
    mlink.rel = "manifest";
    mlink.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type:"application/json" }));
    document.head.appendChild(mlink);
  } catch (e) {}

  // ---- Persistence ----
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (Array.isArray(d.teams) && d.teams.length >= MIN_TEAMS && d.teams.length <= MAX_TEAMS) teams = d.teams;
        if (typeof d.courts === "number" && d.courts >= MIN_COURTS && d.courts <= MAX_COURTS) courts = d.courts;
        if (d.results && typeof d.results === "object") results = d.results;
        if (d.scores && typeof d.scores === "object") scores = d.scores;
      }
    } catch (e) {}
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ teams: teams, courts: courts, results: results, scores: scores })); } catch (e) {}
  }

  // ---- Helpers ----
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function restingFor(round) {
    var playing = {};
    schedule.forEach(function (g) { if (g.round === round) { playing[g.a] = 1; playing[g.b] = 1; } });
    var out = [];
    teams.forEach(function (n, i) { if (!playing[i]) out.push(n); });
    return out;
  }
  function playedCount() {
    var n = 0;
    schedule.forEach(function (g) { if (results[pairKey(g.a, g.b)] !== undefined) n++; });
    return n;
  }
  function totalGames() {
    var t = teams.length;
    return (t * (t - 1)) / 2;
  }
  // Split rows into runs that share the same value of fn(row), best (highest) first.
  function partition(rows, fn) {
    var sorted = rows.slice().sort(function (x, y) { return (fn(y) - fn(x)) || (x.idx - y.idx); });
    var out = [];
    sorted.forEach(function (r) {
      var last = out[out.length - 1];
      if (last && fn(last[0]) === fn(r)) last.push(r); else out.push([r]);
    });
    return out;
  }

  // Order teams tied on record: head-to-head among them (re-applied to any
  // smaller group still tied), then point difference. Returns tiers of teams
  // that remain tied.
  function breakTie(group) {
    if (group.length < 2) return [group];
    var inGroup = {};
    group.forEach(function (r) { inGroup[r.idx] = 1; });
    group.forEach(function (r) {
      r.h2h = 0;
      schedule.forEach(function (g) {
        var other = g.a === r.idx ? g.b : (g.b === r.idx ? g.a : -1);
        if (other !== -1 && inGroup[other] && results[pairKey(g.a, g.b)] === r.idx) r.h2h++;
      });
    });
    var byH2h = partition(group, function (r) { return r.h2h; });
    if (byH2h.length > 1) return [].concat.apply([], byH2h.map(breakTie));
    return partition(group, function (r) { return r.diff; });
  }

  function standings() {
    var rows = teams.map(function (name, idx) {
      var wins = 0, done = 0, diff = 0, scored = 0;
      schedule.forEach(function (g) {
        if (g.a === idx || g.b === idx) {
          var w = results[pairKey(g.a, g.b)];
          if (w !== undefined) { done++; if (w === idx) wins++; }
          var s = scoreOf(g.a, g.b);
          if (s) { scored++; diff += s[idx] - s[idx === g.a ? g.b : g.a]; }
        }
      });
      return { idx: idx, name: name, wins: wins, played: done, losses: done - wins, diff: diff, scored: scored };
    });
    var byRecord = [];
    partition(rows, function (r) { return r.wins; }).forEach(function (sameWins) {
      byRecord = byRecord.concat(partition(sameWins, function (r) { return -r.losses; }));
    });
    var out = [], rank = 1;
    byRecord.forEach(function (group) {
      breakTie(group).forEach(function (tier) {
        tier.forEach(function (r) { r.rank = rank; r.tied = tier.length > 1; out.push(r); });
        rank += tier.length;
      });
    });
    // Before any game is played, just list teams in order rather than all tied.
    if (playedCount() === 0) out.forEach(function (r, i) { r.rank = i + 1; r.tied = false; });
    return out;
  }
  function roundsList() {
    var seen = {}, out = [];
    schedule.forEach(function (g) { if (!seen[g.round]) { seen[g.round] = 1; out.push(g.round); } });
    return out;
  }

  var ICON = {
    sliders: "<svg width='15' height='15' viewBox='0 0 24 24' fill='none' stroke='#1F6B44' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><line x1='4' y1='21' x2='4' y2='14'/><line x1='4' y1='10' x2='4' y2='3'/><line x1='12' y1='21' x2='12' y2='12'/><line x1='12' y1='8' x2='12' y2='3'/><line x1='20' y1='21' x2='20' y2='16'/><line x1='20' y1='12' x2='20' y2='3'/><line x1='1' y1='14' x2='7' y2='14'/><line x1='9' y1='8' x2='15' y2='8'/><line x1='17' y1='16' x2='23' y2='16'/></svg>",
    check: "<svg width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='#D8E000' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6 9 17l-5-5'/></svg>",
    trophy: "<svg width='15' height='15' viewBox='0 0 24 24' fill='none' stroke='#1F6B44' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9H4.5a2.5 2.5 0 0 1 0-5H6'/><path d='M18 9h1.5a2.5 2.5 0 0 0 0-5H18'/><path d='M4 22h16'/><path d='M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22'/><path d='M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22'/><path d='M18 2H6v7a6 6 0 0 0 12 0V2Z'/></svg>",
    reset: "<svg width='15' height='15' viewBox='0 0 24 24' fill='none' stroke='#6E6B59' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8'/><path d='M3 3v5h5'/></svg>"
  };

  function stepper(kind, value, min, max) {
    return "<div class='stepper'>" +
      "<button data-step='" + kind + "' data-dir='-1' " + (value <= min ? "disabled" : "") + ">&minus;</button>" +
      "<span class='val'>" + value + "</span>" +
      "<button data-step='" + kind + "' data-dir='1' " + (value >= max ? "disabled" : "") + ">+</button>" +
    "</div>";
  }

  function teamButtonsHtml(a, b) {
    var w = results[pairKey(a, b)];
    var hasW = w !== undefined;
    function btn(team) {
      var cls = w === team ? "winner" : (hasW ? "loser" : "");
      return "<button class='team-btn " + cls + "' data-a='" + a + "' data-b='" + b + "' data-team='" + team + "'>" +
               (w === team ? ICON.check : "") + "<span>" + esc(teams[team]) + "</span></button>";
    }
    return btn(a) + "<div class='vs'>vs</div>" + btn(b);
  }
  function scoreInput(g, team, s) {
    return "<input type='text' inputmode='numeric' pattern='[0-9]*' maxlength='2' placeholder='Score' " +
           "aria-label='" + esc(teams[team]) + " score' data-a='" + g.a + "' data-b='" + g.b + "' data-score='" + team + "' " +
           "value='" + (typeof s[team] === "number" ? s[team] : "") + "' />";
  }
  function progressText() { return playedCount() + "/" + totalGames() + " played"; }

  // ---- Render ----
  function render() {
    var played = playedCount();
    var total = totalGames();
    var html = "";

    html += "<header>";
    html +=   "<div class='head-row'><h1>Round Robin</h1>" +
              "<span class='progress'>" + progressText() + "</span></div>";
    html +=   "<div class='subtitle'>" + teams.length + " teams &middot; " + courts +
              (courts === 1 ? " court" : " courts") + " &middot; everyone plays everyone once</div>";
    html +=   "<div class='tabs'>" +
                "<button class='tab " + (tab === "schedule" ? "active" : "") + "' data-tab='schedule'>Schedule</button>" +
                "<button class='tab " + (tab === "standings" ? "active" : "") + "' data-tab='standings'>Standings</button>" +
              "</div>";
    html += "</header><main>";

    if (tab === "schedule") {
      html += "<div class='pane'>";

      // Setup card
      html += "<div class='editor " + (setupOpen ? "open" : "") + "'>";
      html +=   "<button class='editor-toggle' data-action='toggle-setup'>" +
                  "<span class='lbl'>" + ICON.sliders + " Setup</span>" +
                  "<span class='state'>" + teams.length + " teams &middot; " + courts +
                    (courts === 1 ? " court" : " courts") + "</span></button>";
      if (setupOpen) {
        html += "<div class='setup-body'>";
        html +=   "<div class='setup-row'><span class='rlabel'>Teams</span>" + stepper("teams", teams.length, MIN_TEAMS, MAX_TEAMS) + "</div>";
        html +=   "<div class='setup-row'><span class='rlabel'>Courts</span>" + stepper("courts", courts, MIN_COURTS, MAX_COURTS) + "</div>";
        html +=   "<div class='divider'></div>";
        html +=   "<div class='sub-label'>Team names</div>";
        html +=   "<div class='name-grid'>";
        teams.forEach(function (t, i) {
          html += "<input data-name='" + i + "' maxlength='18' value='" + esc(t) + "' />";
        });
        html +=   "</div>";
        html += "</div>";
      }
      html += "</div>";

      // Rounds
      roundsList().forEach(function (round) {
        var resting = restingFor(round);
        html += "<section class='round'><div class='round-head'><h2>Round " + round + "</h2>";
        if (resting.length) html += "<span class='bye'>Resting: " + esc(resting.join(", ")) + "</span>";
        html += "</div>";
        schedule.forEach(function (g) {
          if (g.round !== round) return;
          var s = scores[pairKey(g.a, g.b)] || {};
          html += "<div class='match'><div class='court'>Court " + g.court + "</div>";
          html +=   "<div class='vs-grid' data-key='" + pairKey(g.a, g.b) + "'>" + teamButtonsHtml(g.a, g.b) + "</div>";
          html +=   "<div class='score-row'>" + scoreInput(g, g.a, s) + "<span class='dash'>&ndash;</span>" + scoreInput(g, g.b, s) + "</div>";
          html += "</div>";
        });
        html += "</section>";
      });

      html += "<button class='reset' data-action='reset'>" + ICON.reset + " Reset scores</button>";
      html += "</div>";
    } else {
      var rows = standings();
      html += "<div class='pane'><div class='table'>";
      html +=   "<div class='trow thead'><span>#</span><span>Team</span>" +
                "<span style='text-align:center'>Won</span><span style='text-align:center'>Lost</span>" +
                "<span style='text-align:center'>+/&minus;</span></div>";
      var anyTied = false;
      rows.forEach(function (s) {
        var top = s.rank === 1 && s.played > 0 && s.wins > 0;
        if (s.tied) anyTied = true;
        var diff = s.scored === 0 ? "&ndash;" : (s.diff > 0 ? "+" + s.diff : (s.diff < 0 ? "&minus;" + (-s.diff) : "0"));
        html += "<div class='trow " + (top ? "top" : "") + "'>" +
                  "<span class='rank'>" + (s.tied ? "T" : "") + s.rank + "</span>" +
                  "<span class='tname'>" + esc(s.name) + (top ? ICON.trophy : "") + "</span>" +
                  "<span class='twin'>" + s.wins + "</span>" +
                  "<span class='tloss'>" + s.losses + "</span>" +
                  "<span class='tdiff'>" + diff + "</span></div>";
      });
      html += "</div>";
      var left = total - played;
      html += "<p class='note'>" + (left === 0
        ? "All games played &mdash; final standings."
        : (left + " game" + (left === 1 ? "" : "s") + " left to play.")) + "</p>";
      html += "<p class='note'>Ties go to head-to-head, then point difference (+/&minus;) from games with a score entered." +
              (anyTied ? " T = still tied." : "") + "</p>";
      html += "</div>";
    }

    html += "</main>";
    document.getElementById("app").innerHTML = html;
    bind();
  }

  function setTeamCount(n) {
    n = Math.max(MIN_TEAMS, Math.min(MAX_TEAMS, n));
    var next = [];
    for (var i = 0; i < n; i++) next.push(teams[i] != null ? teams[i] : ("Team " + (i + 1)));
    teams = next;
    rebuild(); save(); render();
  }
  function setCourts(c) {
    courts = Math.max(MIN_COURTS, Math.min(MAX_COURTS, c));
    rebuild(); save(); render();
  }

  // Tapping a team records (or clears) the win. A typed score that disagrees
  // with the tapped winner is cleared.
  function bindTeamButtons(root) {
    root.querySelectorAll(".team-btn").forEach(function (b) {
      b.addEventListener("click", function () {
        var a = parseInt(b.getAttribute("data-a"), 10);
        var bb = parseInt(b.getAttribute("data-b"), 10);
        var team = parseInt(b.getAttribute("data-team"), 10);
        var key = pairKey(a, bb);
        var other = team === a ? bb : a;
        var s = scoreOf(a, bb);
        if (results[key] === team) { delete results[key]; delete scores[key]; }
        else {
          results[key] = team;
          if (s && s[team] <= s[other]) delete scores[key];
        }
        save(); render();
      });
    });
  }

  function bind() {
    var app = document.getElementById("app");

    app.querySelectorAll(".tab").forEach(function (b) {
      b.addEventListener("click", function () { tab = b.getAttribute("data-tab"); render(); });
    });

    bindTeamButtons(app);

    // Typing a score updates the winner as soon as both scores differ. Only
    // that game's buttons are redrawn, so the score boxes keep focus.
    app.querySelectorAll("[data-score]").forEach(function (inp) {
      inp.addEventListener("input", function () {
        var a = parseInt(inp.getAttribute("data-a"), 10);
        var b = parseInt(inp.getAttribute("data-b"), 10);
        var team = parseInt(inp.getAttribute("data-score"), 10);
        var key = pairKey(a, b);
        var v = inp.value.replace(/\D/g, "").slice(0, 2);
        if (v !== inp.value) inp.value = v;
        var s = scores[key] || (scores[key] = {});
        if (v === "") delete s[team]; else s[team] = parseInt(v, 10);
        if (!Object.keys(s).length) delete scores[key];
        var full = scoreOf(a, b);
        if (full && full[a] !== full[b]) results[key] = full[a] > full[b] ? a : b;
        save();
        var grid = app.querySelector(".vs-grid[data-key='" + key + "']");
        grid.innerHTML = teamButtonsHtml(a, b);
        bindTeamButtons(grid);
        app.querySelector(".progress").textContent = progressText();
      });
    });

    var setup = app.querySelector("[data-action='toggle-setup']");
    if (setup) setup.addEventListener("click", function () { setupOpen = !setupOpen; render(); });

    app.querySelectorAll("[data-step]").forEach(function (b) {
      b.addEventListener("click", function () {
        var kind = b.getAttribute("data-step");
        var dir = parseInt(b.getAttribute("data-dir"), 10);
        if (kind === "teams") setTeamCount(teams.length + dir);
        else setCourts(courts + dir);
      });
    });

    var reset = app.querySelector("[data-action='reset']");
    if (reset) reset.addEventListener("click", function () {
      if (window.confirm("Clear all recorded scores?")) { results = {}; scores = {}; save(); render(); }
    });

    // Live-edit names without re-render (keeps input focus)
    app.querySelectorAll("[data-name]").forEach(function (inp) {
      inp.addEventListener("input", function () {
        var i = parseInt(inp.getAttribute("data-name"), 10);
        teams[i] = inp.value;
        save();
      });
    });
  }

  load();
  rebuild();
  render();
})();
</script>
</body>
</html>
